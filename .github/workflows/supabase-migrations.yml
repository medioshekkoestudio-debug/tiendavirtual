# Aplica en Supabase (producción) las migraciones nuevas de supabase/migrations
# cada vez que llegan a la rama main.
#
# Secretos requeridos en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  → https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   → contraseña de la base de datos (Project Settings → Database)
name: Supabase migraciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: pozexcjbxmoluftfxxus
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Vincular proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migraciones pendientes
        run: supabase migration list --linked

      - name: Aplicar migraciones
        run: supabase db push --linked
